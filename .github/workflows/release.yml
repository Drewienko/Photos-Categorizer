name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: photos-categorizer
            ffmpeg_url: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          - os: windows-latest
            artifact: photos-categorizer.exe
            ffmpeg_url: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install Qt system libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgl1 libegl1 libxcb-xinerama0 libglib2.0-0

      - name: Download static ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q "${{ matrix.ffmpeg_url }}" -O ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz --strip-components=2 --wildcards "*/bin/ffmpeg"
          chmod +x ffmpeg

      - name: Download static ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${{ matrix.ffmpeg_url }}" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $ffmpeg = Get-ChildItem -Path ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ffmpeg.FullName -Destination ffmpeg.exe

      - name: Install Python dependencies
        run: uv sync

      - name: Swap to CPU-only torch (removes CUDA kernels, saves ~1.3 GB)
        run: |
          uv pip uninstall torch torchvision || true
          uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Build executable
        run: uv run pyinstaller photos-categorizer.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/photos-categorizer/photos-categorizer
            artifacts/photos-categorizer.exe/photos-categorizer.exe
