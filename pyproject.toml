[project]
name = "photos-categorizer"
version = "0.1.0"
description = "AI-powered photo categorization desktop app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ffmpeg-python>=0.2.0",
    "google-cloud-vision>=3.14.0",
    "open-clip-torch>=3.3.0",
    "pyside6>=6.11.1",
]

[project.scripts]
photos-categorizer = "photos_categorizer.main:main"
check = "photos_categorizer._scripts:check"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photos_categorizer"]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "pyright>=1.1.410",
    "pytest>=9.0.3",
    "pytest-qt>=4.5.0",
    "ruff>=0.15.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH", "ANN"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["photos_categorizer"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
include = ["src/photos_categorizer"]
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "vision: Google Vision API tests (uses quota, opt-in with --vision)",
]
